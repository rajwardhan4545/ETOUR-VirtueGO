services:
  mysqldb:
    image: mysql:8.0
    container_name: etour-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: e_tour
    ports:
      - "3307:3306"
    volumes:
      - etour-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  etour-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etour-backend
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysqldb:3306/e_tour?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: rootpassword
      CLIENT_ID: dummy_client_id
      CLIENT_KEY: dummy_client_key
      MAIL_USERNAME: dummy_email
      MAIL_PASSWORD: dummy_password
      GEMINI_API_KEY: dummy_key

volumes:
  etour-db-data:
